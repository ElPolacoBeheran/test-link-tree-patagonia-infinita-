<title>Patagonia Infinita · Kayak &amp; Adventure</title>
<meta name="description" content="Kayak y aventura en Villa La Angostura. Encontrá todos los canales de contacto de Patagonia Infinita.">
<meta name="theme-color" content="#FFCE02">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --amarillo:#FFCE02;      /* Pantone 116 C */
  --ocre:#D19F2A;          /* Pantone 7555 C */
  --ambar:#EAAA21;         /* Pantone 124 C */
  --bronce:#A17528;        /* Pantone 132 C */
  --negro:#231F20;         /* Pantone Black C */
  --negro-2:#2D2829;
  --texto:#F6F1E4;
  --serif:"Cinzel","Trajan Pro","Times New Roman",serif;
  --cond:"Roboto Condensed","Helvetica Neue Condensed","Arial Narrow",Arial,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--negro);scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;min-height:100%;background:var(--negro);color:var(--texto);font-family:var(--cond);font-weight:400;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--amarillo);z-index:10}

.banda{position:relative;height:104px;background:var(--amarillo);overflow:hidden}
.banda svg{position:absolute;right:-30px;top:0;height:100%;width:auto;min-width:420px}

main{max-width:460px;margin:0 auto;padding:0 20px 40px}
.logo{display:block;width:min(100%,360px);height:auto;margin:22px auto 6px}

.links{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;width:100%;
  padding:12px 16px 12px 12px;border-radius:999px;text-decoration:none;
  color:var(--texto);background:var(--negro-2);border:1.5px solid var(--bronce);
  transition:background-color .18s,border-color .18s,color .18s,transform .18s;
}
.link .ico{flex:none;width:44px;height:44px;border-radius:50%;background:var(--amarillo);color:var(--negro);display:grid;place-items:center;transition:background-color .18s}
.link .ico svg{width:22px;height:22px}
.link .txt{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.link .t{font-family:var(--serif);font-weight:600;font-size:1.02rem;letter-spacing:.02em;color:var(--amarillo);transition:color .18s}
.link .s{font-size:.95rem;font-weight:300;letter-spacing:.03em;color:#d9d2c1;overflow-wrap:anywhere;transition:color .18s}
.link:hover,.link:focus-visible{background:var(--amarillo);border-color:var(--amarillo);transform:translateY(-1px)}
.link:hover .t,.link:focus-visible .t,.link:hover .s,.link:focus-visible .s{color:var(--negro)}
.link:hover .ico,.link:focus-visible .ico{background:var(--negro);color:var(--amarillo)}
.link:focus-visible{outline:3px solid var(--texto);outline-offset:3px}
.link.principal{background:var(--amarillo);border-color:var(--amarillo)}
.link.principal .t,.link.principal .s{color:var(--negro)}
.link.principal .ico{background:var(--negro);color:var(--amarillo)}
.link.principal:hover,.link.principal:focus-visible{background:var(--ambar);border-color:var(--ambar)}

footer{margin-top:34px;text-align:center;font-size:.95rem;letter-spacing:.14em;color:var(--ocre);font-weight:300}
footer span{display:block;margin-top:6px;letter-spacing:.04em;color:#a99f8a;font-size:.85rem}

@media (prefers-reduced-motion:reduce){.link,.link *{transition:none}.link:hover,.link:focus-visible{transform:none}}
</style>
